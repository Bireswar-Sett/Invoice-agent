services:
  - type: web
    name: a2a-invoice-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 48 --graceful-timeout 10 run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: A2A_BASE_PATH
        value: /a2a
      - key: DATABASE_URL
        fromDatabase:
          name: a2a-invoice-agent-db
          property: connectionString
      - key: AI_BASE_URL
        value: https://aipipe.org/openrouter/v1
      - key: AI_MODEL
        value: openai/gpt-4.1-nano
      - key: AI_TIMEOUT_SECONDS
        value: "35"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "12000"
      - key: AI_API_KEY
        sync: false

databases:
  - name: a2a-invoice-agent-db
    plan: free
    region: singapore
    databaseName: invoice_agent
    user: invoice_agent
